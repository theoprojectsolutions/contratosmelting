<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · Melting Gestão de Contratos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="login-hero">
    <img src="assets/login-hero.jpg" alt="Melting · 70 Anos · Soluções em Manutenção Industrial">
  </div>

  <div class="hex-layer"></div>

  <div class="login-wrap">

    <div class="badge-pill">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 12a8 8 0 1 1 16 0"/><path d="M4 12a8 8 0 0 0 8 8"/><path d="M20 12a8 8 0 0 1-8 8"/></svg>
      </span>
      <span>Acesso da equipe Melting</span>
    </div>

    <div class="login-tag">Gestão de Contratos · Fase 1 Piloto</div>

    <div class="login-card">
      <h1>Entrar</h1>
      <p class="sub">Use seu e-mail corporativo para acessar o painel.</p>

      <div class="form-msg error" id="form-error">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <span id="form-error-text">E-mail ou senha inválidos.</span>
      </div>

      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="email">E-mail</label>
          <div class="input-shell">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 6 8 7 8-7"/></svg>
            <input type="email" id="email" name="email" placeholder="nome@melting.com.br" required autocomplete="username">
          </div>
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <div class="input-shell">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-pass" id="toggle-pass" aria-label="Mostrar senha">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="row-between">
          <label class="remember"><input type="checkbox" id="remember"> Manter conectado</label>
          <a href="#" class="forgot-link" id="forgot-link">Esqueci minha senha</a>
        </div>

        <button type="submit" class="btn-login" id="btn-login">
          <span class="spinner"></span>
          <span class="btn-text">Entrar</span>
        </button>
      </form>
    </div>

    <div class="login-foot">
      <b>Melting</b> · Soluções em Manutenção Industrial<br>
      Autenticação segura via Supabase
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
